# ============================================================
# 恶意扫描屏蔽 · 2026-11-25
# 放置位置：宝塔 extension 扩展目录（面板重写站点配置时不会被覆盖）
# 适用站点：shiguangxiaoji.com —— 纯静态 Hugo 站，零 PHP / 零后台 / 零数据库
# 背景：访问日志累计 19572 次 404，其中大量为 /.env、/.git/config、
#       /.ssh/id_rsa、wp-admin、phpmyadmin、/v1/models 等漏洞探测
# 语义：444 = 直接关闭连接，不返回任何内容、不写 access_log
#       比 return 404 更彻底（省带宽、省日志、不给探测者任何反馈）
# ============================================================

# 【必须放行】SSL 证书验证目录
# 若被 444 拦截，证书续期（acme challenge）会失败
location ^~ /.well-known/ {
    allow all;
}

# 一、CMS 后台 / 数据库面板 / 中间件控制台探测
#     本站无 PHP、无后台，此类请求 100% 为扫描器
location ~* ^/(wp-admin|wp-login|wp-config|wp-content|wp-includes|wp-json|xmlrpc\.php|phpmyadmin|pma|myadmin|mysql|mysqladmin|adminer|admin|administrator|manager|console|nacos|weboffice|wcm|solr|druid|actuator|jenkins|hudson)(/|$|\.) {
    return 444;
}

# 二、AI / API 端点探测（日志中实测被扫 /v1/models、/v2/logging、/messages/）
location ~* ^/(v1|v2|v3|api|messages|graphql)(/|$|\.) {
    return 444;
}

# 三、敏感文件探测：点文件、配置、备份、密钥、证书、云状态文件
location ~* (^/\.|/\.(env|git|svn|ssh|aws|npm|yarn|vscode|idea)|\.(env|ini|bak|old|sql|log|tfstate|conf|pem|key|p12|jks|crt|csr|yml|yaml)$) {
    return 444;
}

# 四、其他典型扫描特征路径
location ~* ^/(cgi-bin|vendor|shell|cmd|eval|debug|trace|setup|install|backup|dump|db)(/|$) {
    return 444;
}
