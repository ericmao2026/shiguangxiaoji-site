# ============================================================
# Nginx 站点配置 · 适用于阿里云 ECS 2核2G（3M 带宽）
# 放置位置：/etc/nginx/conf.d/site.conf
# 域名已填：shiguangxiaoji.com；证书路径由 certbot 自动写入
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name shiguangxiaoji.com www.shiguangxiaoji.com;

    # 强制跳 HTTPS（证书签发后再取消注释）
    # return 301 https://$host$request_uri;

    root /var/www/site;                        # ← 站点根目录
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/site.access.log;
    error_log  /var/log/nginx/site.error.log;

    # ---- 压缩：文字站的第一优化项 ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/xml application/rss+xml
               application/javascript application/json image/svg+xml;
    gzip_vary on;

    # ---- 静态文件缓存 ----
    location ~* \.(css|js|svg|woff2|png|jpg|jpeg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # HTML 不缓存，保证发文后立即生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    # 安全响应头（不引入额外模块，逐条加）
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}

