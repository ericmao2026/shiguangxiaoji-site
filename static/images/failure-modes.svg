<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" height="540" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c8862b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="540" fill="#ffffff"/>

  <!-- ============ ① 起泡 ============ -->
  <rect x="20" y="20" width="300" height="240" rx="4" fill="#fdfcfa" stroke="#e2ded4"/>
  <text x="38" y="48" font-size="14" font-weight="700" fill="#1f4e5f">① 起泡</text>
  <text x="302" y="48" font-size="11" fill="#c8862b" text-anchor="end">渗透压</text>

  <rect x="38" y="150" width="264" height="45" fill="#7d8c92"/>
  <path d="M110,140 A40,40 0 0 1 190,140 Z" fill="#f7ecd6"/>
  <path d="M38,140 L110,140 A40,40 0 0 1 190,140 L302,140" fill="none" stroke="#1f4e5f" stroke-width="11" stroke-linecap="round"/>
  <circle cx="144" cy="146" r="1.7" fill="#c8862b"/>
  <circle cx="150" cy="148" r="2" fill="#c8862b"/>
  <circle cx="157" cy="145" r="1.6" fill="#c8862b"/>
  <line x1="150" y1="68" x2="150" y2="96" stroke="#c8862b" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="160" y="80" font-size="11" fill="#8a6a30">水</text>

  <text x="38" y="217" font-size="12" fill="#3a3a3a">泡内是一包浓溶液，渗透压从外面拉水</text>
  <text x="38" y="238" font-size="12" fill="#1f4e5f" font-weight="600">阳极与阴极几乎重合 —— 压力驱动</text>

  <!-- ============ ② 剥离 ============ -->
  <rect x="360" y="20" width="300" height="240" rx="4" fill="#fdfcfa" stroke="#e2ded4"/>
  <text x="378" y="48" font-size="14" font-weight="700" fill="#1f4e5f">② 剥离</text>
  <text x="642" y="48" font-size="11" fill="#c8862b" text-anchor="end">碱</text>

  <rect x="378" y="150" width="264" height="45" fill="#7d8c92"/>
  <path d="M455,143 Q505,130 560,139 L560,150 L455,150 Z" fill="#f7ecd6"/>
  <path d="M455,143 Q505,130 560,139 L642,139" fill="none" stroke="#1f4e5f" stroke-width="11" stroke-linecap="round"/>
  <line x1="455" y1="124" x2="455" y2="150" stroke="#c8862b" stroke-width="2.2"/>
  <text x="447" y="118" font-size="11" fill="#c8862b" text-anchor="end">破损点</text>
  <line x1="462" y1="170" x2="518" y2="170" stroke="#c8862b" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="526" y="175" font-size="11" fill="#8a6a30">OH⁻</text>

  <text x="378" y="217" font-size="12" fill="#3a3a3a">阴极在明处（破损点），阳极在界面深处</text>
  <text x="378" y="238" font-size="12" fill="#1f4e5f" font-weight="600">边界一圈圈后退 —— 化学侵蚀驱动</text>

  <!-- ============ ③ 锈蚀蔓延 ============ -->
  <rect x="20" y="280" width="300" height="240" rx="4" fill="#fdfcfa" stroke="#e2ded4"/>
  <text x="38" y="308" font-size="14" font-weight="700" fill="#1f4e5f">③ 锈蚀蔓延</text>
  <text x="302" y="308" font-size="11" fill="#c8862b" text-anchor="end">体积膨胀</text>

  <rect x="38" y="410" width="264" height="45" fill="#7d8c92"/>
  <path d="M128,410 L128,394 Q150,372 172,394 L172,410 Z" fill="#a9713c"/>
  <path d="M38,400 L100,400 Q118,395 128,386" fill="none" stroke="#1f4e5f" stroke-width="11" stroke-linecap="round"/>
  <path d="M172,386 Q182,395 200,400 L302,400" fill="none" stroke="#1f4e5f" stroke-width="11" stroke-linecap="round"/>
  <line x1="140" y1="400" x2="140" y2="380" stroke="#c8862b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="160" y1="400" x2="160" y2="380" stroke="#c8862b" stroke-width="1.5" marker-end="url(#ar)"/>
  <circle cx="150" cy="406" r="3.2" fill="#c8862b"/>

  <text x="38" y="477" font-size="12" fill="#3a3a3a">锈的体积是原金属的 2–4 倍，无处可去</text>
  <text x="38" y="498" font-size="12" fill="#1f4e5f" font-weight="600">顶起涂层 → 缝隙变大 → 锈得更快</text>

  <!-- ============ ④ 丝状腐蚀 ============ -->
  <rect x="360" y="280" width="300" height="240" rx="4" fill="#fdfcfa" stroke="#e2ded4"/>
  <text x="378" y="308" font-size="14" font-weight="700" fill="#1f4e5f">④ 丝状腐蚀</text>
  <text x="642" y="308" font-size="11" fill="#c8862b" text-anchor="end">氧浓差</text>

  <rect x="378" y="410" width="264" height="45" fill="#7d8c92"/>
  <path d="M378,400 L642,400" fill="none" stroke="#1f4e5f" stroke-width="11" stroke-linecap="round"/>
  <line x1="392" y1="392" x2="392" y2="410" stroke="#c8862b" stroke-width="2.2"/>
  <line x1="392" y1="406" x2="516" y2="406" stroke="#a9713c" stroke-width="3" stroke-linecap="round"/>
  <line x1="392" y1="396" x2="488" y2="396" stroke="#a9713c" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="520" cy="406" r="4.4" fill="#c8862b"/>
  <circle cx="492" cy="396" r="4" fill="#c8862b"/>
  <line x1="532" y1="422" x2="558" y2="422" stroke="#c8862b" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="564" y="426" font-size="10.5" fill="#8a6a30">前进</text>

  <text x="378" y="477" font-size="12" fill="#3a3a3a">丝头 pH 1–4、缺氧；丝尾干燥富氧</text>
  <text x="378" y="498" font-size="12" fill="#1f4e5f" font-weight="600">阳极在前、阴极在后 —— 氧浓差驱动</text>
</svg>
